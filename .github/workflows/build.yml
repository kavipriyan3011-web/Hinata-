name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create buildozer.spec
        run: |
          pip install buildozer
          buildozer init
          sed -i 's/^requirements = .*/requirements = python3,pygame,gTTS,google-genai,requests,urllib3,chardet,idna/' buildozer.spec
          sed -i 's/# android.permissions = .*/android.permissions = INTERNET, RECORD_AUDIO, WRITE_EXTERNAL_STORAGE/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec

      - name: Build with Buildozer
        uses: kivy/buildozer-action@v1.22
        with:
          command: buildozer -v android debug
          subfolder: .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
